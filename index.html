  var pool = COMMENTS.slice();
  var current = null;
  var $comment = document.getElementById("comment");
  var $count = document.getElementById("count");
  var $gen = document.getElementById("gen");
  var $copy = document.getElementById("copy");
  var $reset = document.getElementById("reset");
  var copyTimer = null;

  function used() { return COMMENTS.length - pool.length; }

  function refresh() {
    $count.textContent = used() + " of " + COMMENTS.length + " used";
    $gen.disabled = pool.length === 0;
    $copy.disabled = current === null;
    if (pool.length === 0 && current !== null) {
      $count.textContent = "All " + COMMENTS.length + " used. Start a fresh cycle for more.";
    }
  }

  function generate() {
    if (!pool.length) return;
    var i = Math.floor(Math.random() * pool.length);
    current = pool.splice(i, 1)[0];
    $comment.textContent = current;
    $comment.classList.remove("empty", "in");
    void $comment.offsetWidth;
    $comment.classList.add("in");
    resetCopyLabel();
    refresh();
  }

  function resetCopyLabel() {
    clearTimeout(copyTimer);
    $copy.textContent = "Copy";
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }

  function copy() {
    if (current === null) return;
    var done = function (ok) {
      $copy.textContent = ok ? "Copied" : "Press and hold to copy";
      clearTimeout(copyTimer);
      copyTimer = setTimeout(resetCopyLabel, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(current).then(function () { done(true); }, function () { done(fallbackCopy(current)); });
    } else {
      done(fallbackCopy(current));
    }
  }

  function freshCycle() {
    pool = COMMENTS.slice();
    current = null;
    $comment.textContent = "Click Generate comment. Your first comment will land here.";
    $comment.classList.add("empty");
    $comment.classList.remove("in");
    resetCopyLabel();
    refresh();
  }

  $gen.addEventListener("click", generate);
  $copy.addEventListener("click", copy);
  $reset.addEventListener("click", freshCycle);
  refresh();
